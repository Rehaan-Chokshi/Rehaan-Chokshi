name: generate-snake-game-from-github-contribution-grid

on:
  schedule:
    - cron: "0 */12 * * *"  # runs every 12 hours
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Rehaan-Chokshi
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=orange&color_dots=#1e1e1e,#39543c,#4e7a52,#63a068,#79c77e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=orange

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
